global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend nginx_to_haproxy
    bind 127.0.0.1:8080
    mode http
    default_backend python_servers_nginx

backend python_servers_nginx
    mode http
    balance roundrobin
    server s1 127.0.0.1:8888 check
    server s2 127.0.0.1:9999 check
