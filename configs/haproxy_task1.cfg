global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

listen stats
    bind *:80
    mode http
    stats enable
    stats uri /stats

listen web_tcp
    bind *:1325
    mode tcp
    balance roundrobin
    server s1 127.0.0.1:8888 check
    server s2 127.0.0.1:9999 check
